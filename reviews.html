<section class="page-head"><div class="wrap"><p class="eyebrow dark">REVIEWS</p><h1>다녀간 손님 후기</h1>
<p>네이버에 남겨주신 후기 300여 건 중 일부를 원문 그대로 옮겼습니다. 아이디는 일부 가렸어요.</p></div></section><section class="sec pt0"><div class="wrap"><h2>반려견과 함께</h2><div class="rv-grid"><figure class="review"><blockquote>넓은 인조잔디 공간에서 강아지랑 조카들이 뛰어다니며 놀 수 있어 좋습니다. 독채라 프라이빗한 공간에서 편하게 쉴 수 있고 바베큐 공간이 넓어 가족들과 다 같이 좋은 저녁 시간을 보냈습니다.</blockquote><figcaption>tmd**** · 객실 301호 · 2026년 9월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>강아지+부모님+아이 다 같이 있었는데 모두가 만족하는 숙소였어요! 강아지 전용 놀이터도 있고, 공기도 좋고 아이가 놀만한 곳도 있고!</blockquote><figcaption>검정**** · 객실 206호 · 2026년 6월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>강아지랑 여행을 진짜 많이 다니는데 여기 만큼 가성비 좋고 사장님 착하시고 삼박자가 다 맞는 곳은 못본거 같아요</blockquote><figcaption>fly**** · 2026년 6월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>강아지도 아이도 재밌게 지낼수있는 숙소를 서치하다가 발견한 오카맨션!! 방은 아늑하고 반려견 용품도 잘 준비되어있구 침대올라가는 계단센스 까지 ㅎㅎ</blockquote><figcaption>sta**** · 2026년 5월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>여사장님에 친절함과 배려함에 감동이였습니다 또한 가성비와 반려견에 대한 세심한 배려 너무 좋았습니다</blockquote><figcaption>김영**** · 객실 301호 · 2026년 3월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>반려 강아지와 함께 하기도 좋고 연인끼리 오기에도 너무 좋을것 같아요! 침구 좋구요 (강추) 또 재방문 할것 같아요!!!</blockquote><figcaption>태양**** · 객실 207호 · 2026년 3월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>사장님이 너무너무 착하시고 쿨하십니다 덕분에 강아지랑 행복하게 잘 놀다가 갑니다 !</blockquote><figcaption>whg**** · 객실 205호 · 2025년 10월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>바베큐장 옆에 개별운동장있는데 먹으면서 같이 뛰어놀고 만족도 최상-! 애견의자 배변패드 등 애견용품도 구비 다 되어있어요</blockquote><figcaption>ywn**** · 객실 301호 · 2025년 9월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>우리 댕댕이랑 여행은 처음이였는데, 소중한 추억 쌓고 가요 조용히 힐링하기 딱 좋아요!</blockquote><figcaption>pan**** · 객실 301호 · 2025년 8월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>반려동물 있으시면 꼭 가보시길 추천드립니다 시설도 잘 되어있고 계신 직원분도 친절하세요!</blockquote><figcaption>dws**** · 객실 203호 · 2025년 8월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>방도 깨끗하고 너무나 좋아요 울강아지의 견생여행 ㅋㅋ 신나게놀고 수영하고 뻗어자고 방도 아늑하니 좋았습니다</blockquote><figcaption>MN **** · 객실 204호 · 2025년 8월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>목욕용품 물그릇 계단 애견용품 그냥 다 있어요~ 아,..꼭 독채로 예약하세요~ 물놀이하고 바로 앞에서 먹을거 먹고 고기도 구워먹고</blockquote><figcaption>우쭈**** · 2025년 8월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>강아지 수영장 공간이나 뛰어 놀 수 있는 공간도 있어서 좋았고 직원분들 너무 친절하셔서 재미있게 놀다 갔습니당</blockquote><figcaption>vvv**** · 객실 301호 · 2025년 7월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>위에 수영장은 아이와 함께하기 좋고 밑에 애견수영장이 따로 있어서 너무 좋았어요! 바베큐장도 에어컨을 풀로 틀어주셔서 시원하게 고기 먹어서 너무 좋았습니다!</blockquote><figcaption>rla**** · 2025년 7월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>애견 수영장부터 바베큐장, 놀이터, 산책로 등등 즐길 수 있는 것들이 너무 다양해 즐거운 가족여행 다녀왔어요!! 숙소도 너무 깔끔하고 침대도 편했어요</blockquote><figcaption>보하** · 객실 202호 · 2025년 6월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>강아지 수건,배변패드,빗,샴푸,배변봉투도 전부 준비되어있어서 이번 여행에 비가왔는데도 부담없이 놀 수 있었어요! 바베큐장도 깔끔하고 식기류나 조미료도 준비가 잘 되어있었구요!</blockquote><figcaption>방톨 · 2025년 6월 · 네이버 리뷰</figcaption></figure></div></div></section><section class="sec pt0"><div class="wrap"><h2>아이와 물놀이</h2><div class="rv-grid"><figure class="review"><blockquote>6살 딸은 여기저기 뛰어다니며 신나게 놀고 8개월 아들도 안전하게 즐길 수 있는 공간과 미온수풀도 있어서 가족 모두 만족했습니다</blockquote><figcaption>qwe**** · 2026년 7월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>옥화자연휴양림에 갔다가 근처에 있어서 방문했어요. 데크존에서는 아이들 노는게 잘 보여서 어른들은 맥주 한잔 하기에 너무 좋아요</blockquote><figcaption>jeo**** · 2026년 7월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>물 깊이도 좋고 미끄럼틀이나 짚라인도 재미있어하고 놀거리가 많아요 수영장도 애기들 놀 수 있는 곳도 따로 있어서 큰 수영장 작은 수영장 돌아가면서 재미있게 노네요</blockquote><figcaption>롱59** · 2026년 7월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>미온수 수영장도 조그맣게 있어서 물놀이하다 약간쌀쌀하먄 미온수 들어갔다나오고 넘 잘놀았어용</blockquote><figcaption>조녜**** · 2026년 6월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>작은풀도 있고 온수풀도 있고 아이들 놀수 있는게 많아서 신나게 놀다가 갑니다^^</blockquote><figcaption>밭솥**** · 2026년 6월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>직원분 친절하시고 편하게 쉬고 물깊이있어 어른도 수영하기 좋았어요~</blockquote><figcaption>정수**** · 객실 201호 · 2025년 8월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>아이들은 키카 못지않은 시설에 잠수 가능한 놀기좋은 수심의 수영장!!! 짚라인에 방방까지!!!! 부모를 찾지 않으니 어른들은 너무너무 편했답니다!!</blockquote><figcaption>이른**** · 2025년 7월 · 네이버 리뷰</figcaption></figure></div></div></section><section class="sec pt0"><div class="wrap"><h2>바비큐 · 데크</h2><div class="rv-grid"><figure class="review"><blockquote>깔끔하고 조용해서 가족또는 친구들과 놀기 좋은공간이에요 바베큐장도 크고 따뜻햇어용</blockquote><figcaption>미시** · 2026년 11월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>바베큐세트와 매점도 있어서 물놀이용품만 챙기면 종일놀수있어요</blockquote><figcaption>하랑**** · 2026년 8월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>물도깨끗하고 사장님도 너무 친절하시고 데크에서 고기구워먹을건데 너무 좋네요</blockquote><figcaption>rab**** · 2026년 6월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>친구와 함께 벌써 세번째 방문이네요 ㅎㅎ 바베큐 시설을 실내에서 이용할 수 있어서 따뜻하고 좋았습니다!</blockquote><figcaption>shi**** · 객실 205호 · 2026년 1월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>바베큐 시켜서 먹으니 편하고 아이들 놀기 너무 좋아요</blockquote><figcaption>나무**** · 2025년 8월 · 네이버 리뷰</figcaption></figure></div></div></section><section class="sec pt0"><div class="wrap"><h2>객실 · 휴식</h2><div class="rv-grid"><figure class="review"><blockquote>시설이 엄청 깨끗하고 방도 엄청 깨끗하고 분위기 있고 이용하는 내내 기분 좋았습니다</blockquote><figcaption>mjk**** · 객실 203호 · 2026년 5월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>숙소도 깔끔했고 있을게 다 있어서 따로 준비하지 않아도 되서 편하게 즐기고 갑니다</blockquote><figcaption>밀크**** · 객실 201호 · 2026년 3월 · 네이버 리뷰</figcaption></figure><figure class="review"><blockquote>주인분께서 친절하시고 따뜻하고 방음이 잘 되서 좋았어요. 푹 쉬었다 갑니다!</blockquote><figcaption>주헌**** · 객실 202호 · 2026년 3월 · 네이버 리뷰</figcaption></figure></div></div></section>
