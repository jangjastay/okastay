name: IndexNow ping
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Wait for Pages deploy
        run: sleep 90
      - name: Notify Naver and Bing (IndexNow)
        run: |
          KEY=$(python3 -c "import json;print(json.load(open('data/site.json'))['site'].get('indexnow_key',''))")
          [ -z "$KEY" ] && exit 0
          python3 - "$KEY" <<'PY'
          import json, subprocess, sys, urllib.request, urllib.error
          key = sys.argv[1]
          files = subprocess.run(["git", "diff", "--name-only", "HEAD~1", "HEAD"], capture_output=True, text=True).stdout.split()
          urls = []
          for f in files:
              if not f.endswith(".html") or f.startswith(("tools/", "docs/", "apps-script/")) or f == "404.html":
                  continue
              path = "/" + f
              if path.endswith("/index.html"):
                  path = path[:-10]
              urls.append("https://okastay.kr" + path)
          import os, re
          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              urls = re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml", encoding="utf-8").read())
          if not urls:
              print("no html changes"); sys.exit(0)
          body = json.dumps({"host": "okastay.kr", "key": key, "keyLocation": f"https://okastay.kr/{key}.txt", "urlList": urls[:10000]}).encode()
          for ep in ["https://api.indexnow.org/indexnow", "https://searchadvisor.naver.com/indexnow"]:
              try:
                  r = urllib.request.urlopen(urllib.request.Request(ep, data=body, headers={"Content-Type": "application/json; charset=utf-8"}), timeout=30)
                  print(ep, r.status, len(urls))
              except urllib.error.HTTPError as ex:
                  print(ep, "error", ex.code, ex.read()[:500])
              except Exception as ex:
                  print(ep, "error", ex)
          PY
